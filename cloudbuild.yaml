steps:
  # Build + push in one step via buildx (docker-container driver), using a real
  # registry-backed BuildKit cache (`:buildcache` manifest, mode=max — caches every
  # layer, not just the final one). The old approach (`docker pull latest` +
  # `docker build --cache-from=<tag>` + 2x `docker push`) looked like it was caching,
  # but plain image-tag `--cache-from` doesn't reliably import BuildKit layer cache
  # across separate build invocations — so every build was quietly re-running the
  # apt/pip install layers (the expensive ones) and re-pushing the full image. This
  # cuts a redundant full-image pull, redundant full-image push, and gets working
  # layer cache for the unchanged apt/pip layers on code-only changes.
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker buildx create --name cibuilder --driver=docker-container --use
        docker buildx build \
          --cache-from=type=registry,ref=us-central1-docker.pkg.dev/klipse-492407/klipse/processor:buildcache \
          --cache-to=type=registry,ref=us-central1-docker.pkg.dev/klipse-492407/klipse/processor:buildcache,mode=max \
          -t us-central1-docker.pkg.dev/klipse-492407/klipse/processor:$COMMIT_SHA \
          -t us-central1-docker.pkg.dev/klipse-492407/klipse/processor:latest \
          -f docker/external-video-processor/Dockerfile \
          --push \
          .

  # Deploy new revision to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "klipse-processor"
      - "--image=us-central1-docker.pkg.dev/klipse-492407/klipse/processor:$COMMIT_SHA"
      - "--region=us-central1"
      - "--project=klipse-492407"

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
  machineType: E2_HIGHCPU_8
