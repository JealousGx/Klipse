steps:
  # Pull previous image for layer cache (allowed to fail on first build)
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - "docker pull us-central1-docker.pkg.dev/klipse-492407/klipse/processor:latest || true"

  # Build the processor image (context = repo root, Dockerfile in docker/).
  # WEIGHTS_IMAGE references the separately built, rarely-rebuilt weights base image
  # (see cloudbuild-weights.yaml + docker/external-video-processor/Dockerfile.weights) —
  # this step never touches Hugging Face, no secret needed here.
  - name: "gcr.io/cloud-builders/docker"
    env:
      - "DOCKER_BUILDKIT=1"
    args:
      - "build"
      - "--cache-from=us-central1-docker.pkg.dev/klipse-492407/klipse/processor:latest"
      - "--build-arg=WEIGHTS_IMAGE=${_WEIGHTS_IMAGE}"
      - "-t"
      - "us-central1-docker.pkg.dev/klipse-492407/klipse/processor:$COMMIT_SHA"
      - "-t"
      - "us-central1-docker.pkg.dev/klipse-492407/klipse/processor:latest"
      - "-f"
      - "docker/external-video-processor/Dockerfile"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "us-central1-docker.pkg.dev/klipse-492407/klipse/processor:$COMMIT_SHA"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "us-central1-docker.pkg.dev/klipse-492407/klipse/processor:latest"

  # Deploy new revision to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "klipse-processor"
      - "--image=us-central1-docker.pkg.dev/klipse-492407/klipse/processor:$COMMIT_SHA"
      - "--region=us-central1"
      - "--project=klipse-492407"

images:
  - "us-central1-docker.pkg.dev/klipse-492407/klipse/processor:$COMMIT_SHA"
  - "us-central1-docker.pkg.dev/klipse-492407/klipse/processor:latest"

substitutions:
  # Update this only when the weights image is rebuilt (new model version/artifacts) —
  # see cloudbuild-weights.yaml. Override per-trigger in the Cloud Build console without
  # editing this file, if preferred.
  _WEIGHTS_IMAGE: "us-central1-docker.pkg.dev/klipse-492407/klipse/processor-weights:ltx-2.3-distilled-v1"

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
  machineType: E2_HIGHCPU_8
