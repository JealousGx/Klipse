steps:
  # Plain build + push, no registry-backed cache import/export. Deliberate choice: an
  # earlier version used a `:buildcache` manifest (mode=max) to reuse unchanged layers
  # (apt/pip installs, and now the ~67GB baked-in weights layer) across separate Cloud
  # Build invocations — but that meant the weights layer also lived in the cache
  # manifest, adding real complexity for a build that's now expected to just take a
  # while regardless. Every build now re-runs every step from scratch (system packages,
  # weights download, pip installs, SageAttention's from-source compile) — real cost is
  # likely 45min-1hr+ per build, even for a one-line code change, not just when the
  # model version changes. Accepted tradeoff: simpler build config over faster builds.
  - name: "gcr.io/cloud-builders/docker"
    dir: "processor"
    args:
      - "build"
      - "-t"
      - "us-central1-docker.pkg.dev/klipse-492407/klipse/processor:$COMMIT_SHA"
      - "-t"
      - "us-central1-docker.pkg.dev/klipse-492407/klipse/processor:latest"
      - "-f"
      - "Dockerfile"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "us-central1-docker.pkg.dev/klipse-492407/klipse/processor:$COMMIT_SHA"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "us-central1-docker.pkg.dev/klipse-492407/klipse/processor:latest"

  # Update the Cloud Run Job's image (klipse-processor-job). Image-only — everything else
  # (GPU, volume mount, secrets, IAM, timeout/retries) is Terraform-managed
  # (processor/terraform/) with `lifecycle.ignore_changes` on the image field specifically,
  # so this fast per-push image bump doesn't fight Terraform's state. The Job resource
  # itself must already exist (`terraform apply` in processor/terraform/, run once) before
  # this step can run for the first time.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "jobs"
      - "deploy"
      - "klipse-processor-job"
      - "--image=us-central1-docker.pkg.dev/klipse-492407/klipse/processor:$COMMIT_SHA"
      - "--region=us-central1"
      - "--project=klipse-492407"

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
  # machineType intentionally omitted (not set to any explicit value, including a literal
  # "E2_STANDARD_2" string, which isn't actually a valid MachineType enum value — confirmed
  # via the real cloudbuild proto: only UNSPECIFIED, N1_HIGHCPU_8/32, E2_HIGHCPU_8/32,
  # E2_MEDIUM exist). Omitting it falls back to the true default (e2-standard-2), which is
  # the ONLY machine type covered by Cloud Build's 2500 free build-minutes/month — the
  # E2_HIGHCPU_8 this used to be set to is not covered by that free tier at all and would
  # have billed real money on every single build, undermining the whole reason for
  # accepting longer, uncached builds in the first place. The build is now dominated by a
  # network-bound weights download anyway, where HIGHCPU's extra vCPU power wouldn't have
  # helped much regardless.
  # Default build-worker disk wasn't enough — a real build failed with "ResourceExhausted:
  # no space left on device" while BuildKit was finalizing the weights layer (needs the raw
  # ~67GB of downloaded weights AND a compressed diff of that same data on disk
  # simultaneously to build the layer, on top of the base CUDA image + installed packages).
  # 300GB is a generous ceiling given no precise real peak-usage number exists yet (max
  # allowed is 4000GB) — tune down once a real build's actual peak disk usage is known.
  diskSizeGb: "300"

# Cloud Build's own default is 60 minutes ("context deadline exceeded" on a real build —
# confirmed this is exactly what was hit) — too short now that the Dockerfile downloads
# ~67GB of model weights directly from Hugging Face as a build step. This only matters on
# builds where that layer's cache is invalidated (i.e. when the weights step's own content
# changes); ordinary code-only builds hit Docker's layer cache and stay fast regardless of
# this ceiling. 3h is a generous starting point given no real timing data exists yet for
# this specific download — tune down once a real build's actual duration is known.
timeout: "10800s"
