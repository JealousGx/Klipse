steps:
  # Build + push in one step via buildx (docker-container driver), using a real
  # registry-backed BuildKit cache (`:buildcache` manifest, mode=max — caches every
  # layer, not just the final one). The old approach (`docker pull latest` +
  # `docker build --cache-from=<tag>` + 2x `docker push`) looked like it was caching,
  # but plain image-tag `--cache-from` doesn't reliably import BuildKit layer cache
  # across separate build invocations — so every build was quietly re-running the
  # apt/pip install layers (the expensive ones) and re-pushing the full image. This
  # cuts a redundant full-image pull, redundant full-image push, and gets working
  # layer cache for the unchanged apt/pip layers on code-only changes.
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    dir: "processor"
    args:
      - "-c"
      - |
        docker buildx create --name cibuilder --driver=docker-container --use
        docker buildx build \
          --cache-from=type=registry,ref=us-central1-docker.pkg.dev/klipse-492407/klipse/processor:buildcache \
          --cache-to=type=registry,ref=us-central1-docker.pkg.dev/klipse-492407/klipse/processor:buildcache,mode=max \
          -t us-central1-docker.pkg.dev/klipse-492407/klipse/processor:$COMMIT_SHA \
          -t us-central1-docker.pkg.dev/klipse-492407/klipse/processor:latest \
          -f Dockerfile \
          --push \
          .

  # Update the Cloud Run Job's image (klipse-processor-job). Image-only — everything else
  # (GPU, volume mount, secrets, IAM, timeout/retries) is Terraform-managed
  # (processor/terraform/) with `lifecycle.ignore_changes` on the image field specifically,
  # so this fast per-push image bump doesn't fight Terraform's state. The Job resource
  # itself must already exist (`terraform apply` in processor/terraform/, run once) before
  # this step can run for the first time.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "jobs"
      - "deploy"
      - "klipse-processor-job"
      - "--image=us-central1-docker.pkg.dev/klipse-492407/klipse/processor:$COMMIT_SHA"
      - "--region=us-central1"
      - "--project=klipse-492407"

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
  machineType: E2_HIGHCPU_8

# Cloud Build's own default is 60 minutes ("context deadline exceeded" on a real build —
# confirmed this is exactly what was hit) — too short now that the Dockerfile downloads
# ~67GB of model weights directly from Hugging Face as a build step. This only matters on
# builds where that layer's cache is invalidated (i.e. when the weights step's own content
# changes); ordinary code-only builds hit Docker's layer cache and stay fast regardless of
# this ceiling. 3h is a generous starting point given no real timing data exists yet for
# this specific download — tune down once a real build's actual duration is known.
timeout: "10800s"
