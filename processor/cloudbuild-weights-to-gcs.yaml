# One-time migration: copies weight files out of the already-built
# processor-weights Docker image into a GCS bucket, so Cloud Run can mount them
# directly at runtime instead of baking them into the app image on every build.
# Does NOT touch Hugging Face — the weights were already downloaded once when
# Dockerfile.weights was built; this just relocates them from an image layer to GCS.
#
# Run manually, once, from inside processor/:
#   cd processor
#   gcloud builds submit --config=cloudbuild-weights-to-gcs.yaml \
#     --substitutions=_BUCKET=klipse-processor-weights .
#
# Prerequisite: the bucket must already exist —
#   gcloud storage buckets create gs://klipse-processor-weights --location=us-central1

steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "pull"
      - "us-central1-docker.pkg.dev/klipse-492407/klipse/processor-weights:ltx-2.3-distilled-v1"

  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        mkdir -p /workspace/weights-out
        container_id=$(docker create us-central1-docker.pkg.dev/klipse-492407/klipse/processor-weights:ltx-2.3-distilled-v1)
        docker cp "$container_id":/weights /workspace/weights-out/weights
        docker rm "$container_id"
        # Free the pulled image's disk usage now that files are copied out — halves
        # peak disk usage before the upload step, on top of the larger disk allocation.
        docker rmi us-central1-docker.pkg.dev/klipse-492407/klipse/processor-weights:ltx-2.3-distilled-v1 || true

  - name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-c"
      - "gcloud storage cp -r /workspace/weights-out/weights/* gs://${_BUCKET}/"

substitutions:
  _BUCKET: "klipse-processor-weights"

options:
  diskSizeGb: 500
  machineType: E2_HIGHCPU_8
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

timeout: 7200s
