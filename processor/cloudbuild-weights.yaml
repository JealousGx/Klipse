# Builds the model weights STAGING image (Dockerfile.weights) — not something Cloud Run
# pulls directly; cloudbuild-weights-to-gcs.yaml copies files out of this image into the
# GCS bucket Cloud Run actually mounts at runtime. NOT wired to an auto-trigger — run
# manually, only when the model version/artifacts actually change, then re-run
# cloudbuild-weights-to-gcs.yaml to refresh the bucket. Run from inside processor/:
#
#   cd processor
#   gcloud builds submit --config=cloudbuild-weights.yaml \
#     --substitutions=_WEIGHTS_TAG=ltx-2.3-distilled-v1 .
#
# One-time prerequisite (if not already done): store the HF token in Secret Manager and
# grant the Cloud Build service account read access:
#
#   echo -n "<your-hf-token>" | gcloud secrets create hf-token --data-file=-
#   gcloud secrets add-iam-policy-binding hf-token \
#     --member="serviceAccount:<PROJECT_NUMBER>@cloudbuild.gserviceaccount.com" \
#     --role="roles/secretmanager.secretAccessor"
#
# The token's account must have accepted both the Lightricks/LTX-2.3 community license
# and the Gemma license on huggingface.co before this will succeed.

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/hf-token/versions/latest
      env: HF_TOKEN

steps:
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    env:
      - "DOCKER_BUILDKIT=1"
    secretEnv: ["HF_TOKEN"]
    args:
      - "-c"
      - |
        docker build \
          -f Dockerfile.weights \
          -t us-central1-docker.pkg.dev/klipse-492407/klipse/processor-weights:${_WEIGHTS_TAG} \
          --secret id=hf_token,env=HF_TOKEN \
          .

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "us-central1-docker.pkg.dev/klipse-492407/klipse/processor-weights:${_WEIGHTS_TAG}"

substitutions:
  _WEIGHTS_TAG: "ltx-2.3-distilled-v1"

images:
  - "us-central1-docker.pkg.dev/klipse-492407/klipse/processor-weights:${_WEIGHTS_TAG}"

timeout: 7200s

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
  machineType: E2_HIGHCPU_8
