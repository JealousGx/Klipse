# From repo root (recommended):
#   cp packages/external-video-processor/.env.example packages/external-video-processor/.env
#   pnpm processor:docker:up
#   pnpm processor:docker:logs
#
# No weights baked into this image at all (see docker/external-video-processor/Dockerfile) —
# real model weights are mounted from GCS at runtime, only available on the deployed Cloud
# Run service. This local build has an empty /app/weights, so it's for API/plumbing-only
# testing (script-gen, callbacks, watermark, upload, credit flow) — real generation will
# fail predictably at the model-load step. For that without Docker at all, skip this
# compose file and run `uvicorn src.main:app` directly instead (see docs/video-processor.md).
#
# Env is loaded from packages/external-video-processor/.env (see env_file below).

services:
  external-video-processor:
    build:
      context: ../..
      dockerfile: docker/external-video-processor/Dockerfile
    image: klipse-external-video-processor:latest
    ports:
      - "8790:8790"
    # So the container can reach the app on the host (webhook URL must use
    # host.docker.internal — see root .env.example APP_PUBLIC_URL).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8790"
    env_file:
      - ../../packages/external-video-processor/.env
