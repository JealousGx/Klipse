name = "klipse-worker"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = [ "nodejs_compat" ]
# Disable wrangler's framework auto-detection (monorepo root has @tanstack/react-start
# which wrangler 4.x mistakes for a TanStack Start app).
no_bundle = false

routes = [{ pattern = "worker.klipse.app", custom_domain = true }]

# Create once:
#   wrangler queues create klipse-jobs-priority
#   wrangler queues create klipse-jobs-free
# (The old `klipse-jobs` queue can be drained then deleted after cutover.)

[[queues.producers]]
binding = "klipse_jobs_priority"
queue = "klipse-jobs-priority"

[[queues.producers]]
binding = "klipse_jobs_free"
queue = "klipse-jobs-free"

# Paid users (starter / creator / empire) — higher concurrency, faster retry
[[queues.consumers]]
queue = "klipse-jobs-priority"
max_batch_size = 16
max_batch_timeout = 2
max_retries = 15

# Free users — lower concurrency, slower retry
[[queues.consumers]]
queue = "klipse-jobs-free"
max_batch_size = 8
max_batch_timeout = 5
max_retries = 15

[observability.traces]
enabled = true
# Must match the destination name you configured in Cloudflare dashboard
destinations = [ "grafana-traces" ]

[observability.logs]
enabled = true
# Must match the destination name you configured in Cloudflare dashboard
destinations = [ "grafana-logs" ]
